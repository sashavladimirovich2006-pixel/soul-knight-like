name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
          rustc --version

      # Formatting needs no dependencies and no build, so it fails fast.
      - name: Check formatting
        run: cargo fmt --all -- --check

  deps:
    name: resolve dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      # Separated on purpose: if the pinned engine version, its feature set or
      # the MSRV is wrong, it surfaces here instead of inside a long build.
      - name: Fetch dependencies
        run: cargo fetch --locked || cargo fetch

      - name: Show resolved bevy version
        run: cargo tree --depth 1 --package soul_knight_like

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: [fmt, deps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
          rustc --version

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-clippy-

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [fmt, deps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-test-

      - name: Test
        run: cargo test
