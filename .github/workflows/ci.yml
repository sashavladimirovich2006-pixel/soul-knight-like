name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
          rustc --version

      # Formatting needs no dependencies and no build, so it fails fast.
      - name: Check formatting
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee fmt-output.log

      - name: Report failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### fmt failed'
            echo
            echo '```diff'
            head -n 80 fmt-output.log 2>/dev/null || echo 'no output captured'
            echo '```'
          } > report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file report.md

  deps:
    name: resolve dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      # Separated on purpose: if the pinned engine version, its feature set or
      # the MSRV is wrong, it surfaces here instead of inside a long build.
      - name: Fetch dependencies
        run: cargo fetch --locked || cargo fetch

      - name: Show resolved bevy version
        run: cargo tree --depth 1 --package soul_knight_like

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: [fmt, deps]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bevy's default platform features build against ALSA, udev, Wayland and
      # xkbcommon, whose build scripts fail without the development headers.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
          rustc --version

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-clippy-

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets --message-format short 2>&1 | tee cargo-output.log

      - name: Report failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### clippy failed'
            echo
            echo '```'
            grep -E 'error|warning|panicked' cargo-output.log | tail -n 40 2>/dev/null || echo 'no cargo output captured'
            echo '```'
          } > report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file report.md

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [fmt, deps]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-test-

      - name: Test
        run: |
          set -o pipefail
          cargo test --message-format short 2>&1 | tee cargo-output.log

      - name: Report failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### test failed'
            echo
            echo '```'
            grep -E 'error|warning|panicked|FAILED' cargo-output.log | tail -n 40 2>/dev/null || echo 'no cargo output captured'
            echo '```'
          } > report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file report.md
